services:
  - type: web
    name: saas-erp-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_TOKEN_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_PRO_MODEL
        value: gemini-1.5-pro
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_API_VERSION
        value: v18.0
      - key: SEPAY_API_KEY
        sync: false
      - key: SEPAY_ACCOUNT_NUMBER
        sync: false
      - key: SEPAY_BANK_CODE
        value: MB
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
      - key: SEPAY_AUTH_MODE
        value: hmac # Set to "both" if legacy Apikey webhook auth is required
      - key: SEPAY_PAYMENT_PREFIX
        value: DH
      - key: SEPAY_MEMO_PREFIX
        value: "SEVQR" # Set to "" if bank transfer memo prefix is unused
      - key: SEPAY_STRICT_ACCOUNT_CHECK
        value: "true"
      - key: SEPAY_QR_TEMPLATE
        value: compact
      - key: SEPAY_PG_MERCHANT_ID
        sync: false
      - key: SEPAY_PG_SECRET_KEY
        sync: false
      - key: SEPAY_PG_IPN_SECRET
        sync: false
      - key: SEPAY_PG_ENV
        value: sandbox
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: '["https://saa-s-repo-demo.vercel.app","https://saas-repo-demo.onrender.com"]'
